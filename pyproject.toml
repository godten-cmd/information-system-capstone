[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Research prototype foundation for Agentic RAG enterprise knowledge management experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "HYTech Solutions Research Prototype" }
]
dependencies = [
  "pydantic>=2.7,<3.0",
  "typer>=0.12,<1.0",
  "pyyaml>=6.0,<7.0",
  "jinja2>=3.1,<4.0",
  "jsonlines>=4.0,<5.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.7",
  "openai>=1.0,<2.0",
  "anthropic>=0.30,<2.0",
  "tenacity>=8.0,<10.0",
  "python-dotenv>=1.0,<2.0",
  # V2 dependencies
  "langgraph>=0.2,<1.0",
  "mcp>=1.0,<2.0",
  "langchain-core>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6.0,<1.0",
]

[project.scripts]
enterprise-rag = "enterprise_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: marks tests that require real index files and model weights",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ANN",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
